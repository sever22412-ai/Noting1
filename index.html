<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        .text-container {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
            letter-spacing: 2px;
        }
        .cursor::after {
            content: '_';
            animation: blink 1s step-start infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,255,102,0.03) 50%, rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="text-container cursor">
        Здесь ничего нет
    </div>
</body>
</html>
